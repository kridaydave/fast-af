<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
#t4-throughput { color:var(--foreground); font-family:var(--font-sans); margin:0; }
#t4-throughput figcaption { font-size:16px; font-weight:600; margin:0 0 6px; }
#t4-throughput .sub, #t4-throughput .note { color:var(--muted-foreground); font-size:12px; line-height:1.5; }
#t4-throughput .plot { margin:20px 0 10px; }
#t4-throughput .row { display:grid; grid-template-columns:120px minmax(0,1fr) 58px; gap:10px; align-items:center; min-height:45px; font-size:13px; }
#t4-throughput .track { position:relative; height:26px; }
#t4-throughput .track::after { content:""; position:absolute; top:-10px; bottom:-10px; left:60%; border-left:1px dashed var(--warning); pointer-events:none; }
#t4-throughput .bar { position:absolute; top:4px; height:18px; border-radius:3px; background:var(--chart-1); }
#t4-throughput .old { background:var(--muted-foreground); }
#t4-throughput .number { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; }
#t4-throughput .ticks { display:flex; justify-content:space-between; font-size:11px; color:var(--muted-foreground); }
#t4-throughput .gate { position:absolute; left:60%; transform:translateX(-50%); color:var(--warning); white-space:nowrap; font-size:12px; }
#t4-throughput .separator { margin-top:12px; }
@media(max-width:450px) { #t4-throughput .row { grid-template-columns:94px minmax(0,1fr) 46px; gap:8px; font-size:12px; } }
</style>
</head><body>
<figure id="t4-throughput" aria-label="T4 processed-token throughput. Optimized production sampled-frontier throughput is 7,827 tokens per second, above the 6,000 speed floor.">
  <figcaption>Measured T4 throughput</figcaption>
  <div class="sub">Processed tokens/s · 109M parameters · context 1024 · global batch 64</div>
  <div class="plot">
    <div class="row" style="min-height:25px"><span></span><div style="position:relative;height:20px"><span class="gate">6,000 floor</span></div><span></span></div>
    <div class="row"><span>v1 · sampled</span><div class="track"><div class="bar old" style="width:31.733%"></div></div><span class="number">3,173</span></div>
    <div class="row"><span>v2 · sampled P0</span><div class="track"><div class="bar" style="width:78.273%"></div></div><span class="number">7,827</span></div>
    <div class="row separator"><span>v1 · full context</span><div class="track"><div class="bar old" style="width:34.899%"></div></div><span class="number">3,490</span></div>
    <div class="row"><span>v2 · full context</span><div class="track"><div class="bar" style="width:84.643%"></div></div><span class="number">8,464</span></div>
    <div class="row" style="min-height:22px"><span></span><div class="ticks"><span>0</span><span>5,000</span><span>10,000</span></div><span></span></div>
  </div>
  <div class="note">v1 uses micro-batch 4 / accumulation 16; v2 uses 8 / 8. Medians shown. Optimized sampled-frontier P0 uses three 50-update windows on the full corpus; the other rows use bounded short probes.</div>
</figure>

</body></html>
