# Benchmark week roster for EdgeFast-Diff 100M (D1 = 100M).
#
# Every entry is one benchmark run. `backend` selects how the harness drives it:
#   - hf     : autoregressive, driven by Transformers (greedy decode, batch 1).
#   - dllm   : masked/block diffusion via the dLLM framework (LLaDA, Dream, ...).
#   - custom : a backend defined in bench/backends.py (e.g. smoldlm-144m).
#
# Timing contract (spec): batch 1, prompt_len in / out_len out, median of `runs`
# timed generations, same GPU. TPS uses total model-generation time after
# host-side tokenization, including prefill/cache warm. Prefill is also logged.
# HumanEval pass@1 (n=1) is the quality guardrail and is tracked separately.
#
# Eval protocol: every model with humaneval: true must declare eval_prompt:
# completion (raw HumanEval prompt as the continuation prefix) or chat
# (tokenizer.apply_chat_template + the fixed instruction in
# bench/humaneval.py). The mode is never inferred from the repo name.
# humaneval_n selects the slice (50 default; 164 for the G0 calibration run).

common:
  prompt_len: 1024      # tokens in — enforced by fit_prompt() in run.py
  out_len: 1024         # tokens out
  runs: 5               # median of N timed runs
  batch: 1              # batch 1, one model per GPU (T4 has one usable)
  seed: 0
  dtype: float16        # T4 has no bf16; fp16 is the full tier
  humaneval: true       # track pass@1 for every AR model
  humaneval_n: 50       # HumanEval slice; set 164 for the G0 calibration run
  warmup: 1             # short backend warmup calls before measured runs

models:
  # ---- AR baselines, ~100M band (D1's scale) ----
  - id: smollm2-135m
    backend: hf
    repo: HuggingFaceTB/SmolLM2-135M-Instruct
    quant: null
    humaneval: true
    eval_prompt: chat       # instruct model: raw continuation produced prose
    note: "135M AR, Apache-2.0, L1 yardstick"

  - id: qwen3.5-0.8b            # B0
    backend: hf
    repo: Qwen/Qwen3.5-0.8B
    quant: null
    humaneval: true
    eval_prompt: completion
    note: "GDN hybrid AR, same family as D1. B1/B2 build on this."

  - id: qwen3.5-0.8b-int4       # B1
    backend: hf
    repo: Qwen/Qwen3.5-0.8B
    quant: int4                 # bnb int4 (AWQ also runs on T4, see BENCHMARK_WEEK B1)
    humaneval: true
    eval_prompt: completion
    note: "B0 + bitsandbytes post-training int4; measured 0.79x fp16 on the lean T4 run"

  - id: qwen3.5-0.8b-dflash2    # B2 placeholder; intentionally fails until wired
    backend: hf
    repo: Qwen/Qwen3.5-0.8B
    quant: int4
    speculative: dflash2
    humaneval: true
    eval_prompt: completion
    note: "B0 + int4 + DFlash2; not wired, so the harness refuses to mislabel plain int4 as B2"

  - id: lfm2.5-350m
    backend: hf
    repo: LiquidAI/LFM2.5-350M
    quant: null
    humaneval: true
    eval_prompt: completion
    note: "354M hybrid AR, fast; latest small hybrid reference"

  # ---- diffusion, size-matched to D1 ----
  - id: smoldlm-144m
    backend: custom
    repo: HoangHa/smoldlm-144m
    block_size: 32
    steps: 8
    confidence: 0.9
    temperature: 0.0
    commit: confidence
    kv_cache: false
    humaneval: false            # diffusion row is speed-only; HumanEval stays AR-only (spec)
    eval_prompt: completion
    note: "144M block diffusion, block_size 32, Apache-2.0. D1's closest size-matched diffusion twin."

  - id: smoldlm-144m-cached
    backend: custom
    repo: HoangHa/smoldlm-144m
    block_size: 32
    steps: 8
    confidence: 0.9
    temperature: 0.0
    commit: confidence
    kv_cache: true
    compare_to: smoldlm-144m
    semantic_equivalence_claimed: false
    humaneval: false
    eval_prompt: completion
    note: "Cached-prefix smoldlm policy; semantically different from the uncached full-sequence approximation, not a pure cache-only A/B."

  # ---- paradigm check at scale ----
  # 8B rows run LAST (user call 2026-11-04): an OOM crash kills the process,
  # and every row above is already saved by then (run.py writes results after
  # each model). The LLaDA 4-bit path is deferred until the end of benchmarking.

  - id: llada-8b-default
    backend: dllm
    repo: GSAI-ML/LLaDA-8B-Base
    mode: default               # native masked diffusion
    steps: 32
    humaneval: false
    eval_prompt: completion
    note: "LLaDA-8B default config"

  - id: llada-8b-fastdllm
    backend: dllm
    repo: GSAI-ML/LLaDA-8B-Base
    mode: fast-dllm             # Fast-dLLM decoding policy
    steps: 8
    humaneval: false
    eval_prompt: completion
    note: "LLaDA-8B with Fast-dLLM decode; the tuned-policy comparison"
